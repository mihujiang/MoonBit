name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify moon version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Build (${{ matrix.target }})
        run: moon build --target ${{ matrix.target }}

      - name: Run tests
        run: moon test --target ${{ matrix.target }}
